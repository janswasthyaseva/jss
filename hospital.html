<!DOCTYPE html>
<html>
<head>
  <title>JSS Hospital Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>

<h3>JSS – Hospital Dashboard</h3>

<p>Scan patient QR / Enter Patient ID</p>

<button onclick="scan()">Scan Patient</button>

<p id="msg"></p>

<script>
const HOSPITAL_ID = "HPXXXX";   // replace per hospital

function scan(){
  const pid = prompt("Enter Patient ID");
  if(!pid) return;

  google.script.run.scanQR(pid, "HOSPITAL", HOSPITAL_ID);
  msg.innerText = "Scan recorded.";
}
</script>

</body>
</html>
